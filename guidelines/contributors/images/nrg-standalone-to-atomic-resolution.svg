<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A teal box on the left labeled Standalone Requirement contains the full bullet text: NormativeSubject MUST include charges representing unused portions of a commitment when Condition A. A vertical divider separates it from the right side, and a dotted leader line connects it to an identical purple box labeled Atomic Requirement.</desc>

