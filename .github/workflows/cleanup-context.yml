name: PR Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-working-folders:
    name: Working folder cleanup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract issue number from branch
        id: branch
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          # Extract issue number if branch starts with a number (e.g., 1805-ai-usage-policy)
          ISSUE_NUMBER=$(echo "$BRANCH_NAME" | grep -oE '^[0-9]+' || true)
          echo "issue=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_NAME, Issue: $ISSUE_NUMBER"

      - name: Check for working folder
        id: check
        run: |
          ISSUE_NUMBER="${{ steps.branch.outputs.issue }}"
          BRANCH_NAME="${{ steps.branch.outputs.branch }}"
          FOUND=""

          if [ -n "$ISSUE_NUMBER" ]; then
            # Look for folder matching this PR's branch name
            FOLDER=".ai/work/${BRANCH_NAME}"
            if [ -d "$FOLDER" ]; then
              FOUND="$FOLDER"
            fi
          fi

          if [ -n "$FOUND" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "folder=$FOUND" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Report status
        run: |
          if [ "${{ steps.check.outputs.found }}" == "true" ]; then
            echo "::notice title=Cleanup needed before merge::Working folder found: ${{ steps.check.outputs.folder }}. After final approval, delete this folder before merging."
            echo ""
            echo "📋 Working folder for this PR:"
            echo "   ${{ steps.check.outputs.folder }}"
            echo ""
            echo "After final approval, before merging:"
            echo "   Delete the folder: ${{ steps.check.outputs.folder }}"
            echo ""
            echo "This check will pass once the folder is removed."
            exit 1
          else
            echo "✅ No working folder found for this PR - ready for merge"
          fi
