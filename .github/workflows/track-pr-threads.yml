name: Sync PR Open Thread Counts
on:
  schedule:
    - cron: '0 */4 * * *'
  pull_request_review_comment:
    types: [created, deleted]
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (leave blank for all open PRs)'
        required: false

jobs:
  sync:
    name: Sync PR Open Thread Counts
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'pull_request' && github.event.action == 'ready_for_review')
    concurrency:
      group: sync-threads-${{ github.event.pull_request.id || 'bulk' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate and Sync
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ORG: "FinOps-Open-Cost-and-Usage-Spec"
          PROJECT_NUM: 7
          FIELD_NAME: "PR Open Threads"
          SINGLE_PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          # 1. Fetch Project and Field IDs
          PROJ_DATA=$(gh api graphql -f query='
            query($org: String!, $p_num: Int!) {
              organization(login: $org) {
                projectV2(number: $p_num) {
                  id
                  fields(first: 50) { nodes { ... on ProjectV2Field { id name } } }
                }
              }
            }' -f org="$ORG" -F p_num=$PROJECT_NUM)

          PROJECT_ID=$(echo "$PROJ_DATA" | jq -r '.data.organization.projectV2.id')
          FIELD_ID=$(echo "$PROJ_DATA" | jq -r --arg NAME "$FIELD_NAME" '.data.organization.projectV2.fields.nodes[] | select(.name==$NAME) | .id')

          if [ -z "$FIELD_ID" ] || [ "$FIELD_ID" == "null" ]; then
            echo "Error: Field '$FIELD_NAME' not found in Project #$PROJECT_NUM"
            exit 1
          fi

          # 2. Identify PRs
          if [ -n "$SINGLE_PR" ]; then
            echo "Processing single PR: #$SINGLE_PR"
            PR_LIST=($SINGLE_PR)
          else
            echo "Running bulk sync for all open PRs..."
            PR_LIST=($(gh pr list --state open --json number --jq '.[].number'))
          fi

          # 3. Loop and Update
          for NUM in "${PR_LIST[@]}"; do
            echo "--- Processing PR #$NUM ---"
            
            # Fetch Threads and Node ID
            PR_DATA=$(gh pr view "$NUM" --json id,reviewThreads --jq '{id: .id, count: [.reviewThreads[] | select(.isResolved == false)] | length}')
            PR_NODE_ID=$(echo "$PR_DATA" | jq -r '.id')
            COUNT=$(echo "$PR_DATA" | jq -r '.count')

            if [ -z "$PR_NODE_ID" ] || [ "$PR_NODE_ID" == "null" ]; then 
              echo "PR #$NUM not found. Skipping."
              continue
            fi

            # DEBUG OUTPUT
            echo "Debug: PR #$NUM Summary - Open Threads found: $COUNT"

            # 4. Resolve Item ID using the mutation (avoids 100-item pagination limit)
            ITEM_ID=$(gh api graphql -f query='
              mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { 
                  item { id } 
                }
              }' -f project="$PROJECT_ID" -f content="$PR_NODE_ID" --jq '.data.addProjectV2ItemById.item.id')

            if [ -n "$ITEM_ID" ] && [ "$ITEM_ID" != "null" ]; then
              # 5. Perform the Update
              gh api graphql -f query='
                mutation($project: ID!, $item: ID!, $field: ID!, $value: Float!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $f, value: { number: $v }
                  }) { clientMutationId }
                }' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f f="$FIELD_ID" -F v=$COUNT
              echo "Updated PR #$NUM: $COUNT open threads."
            else
              echo "Error: Could not resolve Project Item ID for PR #$NUM."
            fi
          done